# Render Blueprint — lets Render auto-configure the backend from this repo.
# In the Render dashboard: New -> Blueprint -> connect this repo -> it reads this file.
services:
  - type: web
    name: eduplace-crm-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in the Render dashboard — don't commit real keys
      - key: ASSISTANT_MODEL
        value: claude-sonnet-5
      - key: FRONTEND_URL
        sync: false          # set to your Vercel URL after the frontend is deployed
